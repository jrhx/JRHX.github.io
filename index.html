<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无偿游戏分享站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo">GameBox</a>
            <ul class="nav-menu">
                <li><a class="active" data-page="homePage">首页</a></li>
                <li><a data-page="categoryPage">分类</a></li>
            </ul>
            <div class="nav-right">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索游戏...">
                </div>
                <div class="user-menu">
                    <span>个人中心 ▾</span>
                    <div class="user-dropdown">
                        <a id="showFavorites">我的收藏</a>
                        <a id="showHistory">浏览历史</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <div class="container">
        <!-- 首页 -->
        <div class="page active" id="homePage">
            <!-- 轮播图 -->
            <div class="carousel">
                <div class="carousel-slides">
                    <div class="slide active" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                        <div class="slide-content">
                            <h2>本周精选：独立游戏神作合集</h2>
                            <p>6款口碑炸裂的小众佳作，每一款都值得玩上百小时</p>
                        </div>
                    </div>
                    <div class="slide" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                        <div class="slide-content">
                            <h2>联机游戏推荐 | 好友聚会必备</h2>
                            <p>支持多人在线联机，欢乐加倍，友情减倍</p>
                        </div>
                    </div>
                    <div class="slide" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                        <div class="slide-content">
                            <h2>新游上线 | 最新汉化资源整理</h2>
                            <p>每日更新，全部无偿分享，无套路直接下载</p>
                        </div>
                    </div>
                </div>
                <button class="carousel-btn prev">‹</button>
                <button class="carousel-btn next">›</button>
                <div class="carousel-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>

            <!-- 公告栏 -->
            <div class="notice">
                本站所有游戏均为无偿分享，请勿用于商业用途；如有侵权请联系删除。
            </div>

            <!-- 热门游戏 -->
            <div class="section-title">
                <span>热门推荐</span>
                <a class="more" onclick="document.querySelector('[data-page=categoryPage]').click()">查看全部 ›</a>
            </div>
            <div class="game-grid" id="hotGames"></div>

            <!-- 最新游戏 -->
            <div class="section-title">
                <span>最新上线</span>
                <a class="more" onclick="document.querySelector('[data-page=categoryPage]').click()">查看全部 ›</a>
            </div>
            <div class="game-grid" id="newGames"></div>
        </div>

        <!-- 分类页 -->
        <div class="page category-page" id="categoryPage">
            <div class="filter-bar">
                <div class="filter-group">
                    <div class="filter-label">游戏分类</div>
                    <div class="filter-tags" id="filterTags"></div>
                </div>
            </div>
            <div class="section-title">
                <span>全部游戏</span>
            </div>
            <div class="game-grid" id="categoryGames"></div>
        </div>
    </div>

    <!-- 游戏详情弹窗 -->
    <div class="modal-overlay" id="gameModal">
        <div class="modal">
            <div class="modal-header" id="modalCover">
                <button class="modal-close" id="modalClose">×</button>
            </div>
            <div class="modal-body">
                <h2 class="modal-title" id="modalTitle"></h2>
                <div class="game-tags" id="modalTags" style="margin-bottom: 12px;"></div>
                <div class="modal-meta">
                    <span id="modalRating"></span>
                    <span id="modalDownloads"></span>
                </div>
                <p class="modal-desc" id="modalDesc"></p>
                <button class="download-btn" id="downloadBtn">获取游戏</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
