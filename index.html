<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免费游戏分享站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "微软雅黑", sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .game-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        .game-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background-color: #eee;
        }
        .game-info {
            padding: 15px;
        }
        .game-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .game-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
            line-height: 1.4;
            min-height: 40px;
        }
        .download-btn {
            display: block;
            width: 100%;
            padding: 8px;
            background-color: #3498db;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
        }
        .download-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <header>
        <h1>无偿游戏分享站</h1>
        <p>整理分享优质单机、联机小游戏，全部免费取用</p>
    </header>
    <div class="container">
        <h2>热门游戏</h2>
        <div class="game-grid">
            <!-- 游戏卡片1 -->
            <div class="game-card">
                <img src="" alt="游戏封面">
                <div class="game-info">
                    <div class="game-title">示例游戏1</div>
                    <div class="game-desc">休闲益智小游戏，解压必备。</div>
                    <a href="#" class="download-btn">下载游戏</a>
                </div>
            </div>
            <!-- 游戏卡片2 -->
            <div class="game-card">
                <img src="" alt="游戏封面">
                <div class="game-info">
                    <div class="game-title">示例游戏2</div>
                    <div class="game-desc">经典冒险闯关，支持双人联机。</div>
                    <a href="#" class="download-btn">下载游戏</a>
                </div>
            </div>
            <!-- 复制上面的卡片代码，即可添加更多游戏 -->
        </div>
    </div>
</body>
</html>
